modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="pack.png"
authors="jim139129 (NeoForge rewrite), Cibernet (original Splatcraft), contributors"
description='''
Splatoon-inspired blocks, items, weapons, ink systems, and arena tools for Minecraft.
'''

[[mixins]]
config="splatcraft.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
